timeout: 60
default_entry: MyOS

/MyOS
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: myos.boot=normal myos.loglevel=normal myos.console.scale=1
    module_path: boot():/boot/initramfs.cpio
    module_string: initramfs

/MyOS large text
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: myos.boot=normal myos.loglevel=normal myos.console.scale=2
    module_path: boot():/boot/initramfs.cpio
    module_string: initramfs

/MyOS verbose
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: myos.boot=normal myos.loglevel=verbose myos.console.scale=1
    module_path: boot():/boot/initramfs.cpio
    module_string: initramfs

/MyOS debug
    protocol: limine
    path: boot():/boot/kernel.elf
    cmdline: myos.boot=normal myos.loglevel=debug myos.console.scale=1
    module_path: boot():/boot/initramfs.cpio
    module_string: initramfs
